    - heading "建议的阅读顺序" [level=2] [ref=e67]
    - generic [ref=e68]: 如果你的目标是真正读懂 GRPO（而不是跑通代码），按这个顺序：
    - list [ref=e69]:
      - listitem [ref=e70]: 5.5 / 5.6 — 先建立 logprob 的直觉，尤其是「logprob 是坏的置信度」这条。它会在第 3 步和第 6 步反复出现。
      - listitem [ref=e71]: 6.7–6.9 — 全书核心。三条独立知识线：链式法则、组内归一化、加权平均。
      - listitem [ref=e72]: 8.6 — 回头看 sum vs mean 在监督学习里为什么反过来。理解了两个场景的差异，就真正掌握了「聚合方式」这件事。
      - listitem [ref=e73]: 4.4 / 4.5 — 采样机制。知道 temperature 和 top-p 在动什么，才能理解 self-consistency 的参数为什么这么调。
      - listitem [ref=e74]: 7.3 — 熵。诊断工具，也是第 6 步的钥匙。
      - listitem [ref=e75]: 7.4 → 7.5 — 最后读。裁剪和 KL 是稳定训练的补丁，而 7.5 的失效模式需要前面所有的概念才能看懂。
