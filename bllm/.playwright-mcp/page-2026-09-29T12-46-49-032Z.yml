    - generic [ref=f5e1263]:
      - generic [ref=f5e1264]: PPL 的三个使用陷阱
      - paragraph [ref=f5e1265]: ① 不可跨 tokenizer 比较。PPL 依赖词表大小和切分粒度。同一段文本用 50k 词表 PPL=30、用 32k 词表可能 PPL=20，但这不代表后者更好。跨模型比较必须同一个 tokenizer。
      - paragraph [ref=f5e1266]: ② 不可跨长度比较。loss 是逐 token 平均，短句和长句的 PPL 天生不同。评测必须固定评测集和长度设置。
      - paragraph [ref=f5e1267]: ③ PPL 下降不等于模型变好。PPL 只衡量对下一个 token 的拟合，不衡量事实性、安全性、指令遵循能力。第 7 章的指令微调和第 8 章的评测说明了这一点。
