    - generic [ref=f5e2079]:
      - generic [ref=f5e2080]: 两者顺序有讲究，但不是任意的
      - paragraph [ref=f5e2081]: 正确顺序是 先缩放 logits → 再 top-k 掩码 → 最后 softmax。原因：top-k 是「按排名」筛选的，而排名与温度无关（温度单调变换不改顺序），所以两种顺序选出的 k 个 token 完全相同。但掩码必须在 softmax 之前，否则要额外做一次重归一化，浪费一步。
      - paragraph [ref=f5e2082]:
        - text: 原书
        - code [ref=f5e2083]: generate
