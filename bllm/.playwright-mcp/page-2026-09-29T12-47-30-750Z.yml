    - heading "一条贯穿全书的暗线" [level=2] [ref=f6e189]
    - generic [ref=f6e190]:
      - generic [ref=f6e191]: 梯度必须能流回去
      - paragraph [ref=f6e192]: 附录 A 说 sigmoid 导数会饱和；第 3 章说 大 logits 让 softmax 梯度归零；第 4 章说 残差连接提供梯度旁路。
      - paragraph [ref=f6e193]: 这三处是同一个问题的三个侧面：如何让梯度在几十层内不消失。答案是三管齐下——缩放 logits（3.4）+ 用导数不饱和的激活函数（4.3）+ 加残差旁路（4.4）。
      - paragraph [ref=f6e194]: 现代 LLM 架构里大半的「非标准」设计，都是为了这一条。
