    - heading "建议的阅读顺序" [level=2] [ref=f6e67]
    - paragraph [ref=f6e68]: 如果你的目标是真正读懂 LLM 的数学（而不是跑通代码），按这个顺序：
    - list [ref=f6e69]:
      - listitem [ref=f6e70]: 第 5 章 — 先建立交叉熵和困惑度的直觉。这是全书的度量基础，后面每一章都在最小化它。务必理解「困惑度 = 等效词表大小」这句话，它让 48,726 这种数字变得可解释。
      - listitem [ref=f6e71]:
        - text: 第 3 章 — 缩放点积是全书最值得反复看的一节。除以
        - generic [ref=f6e73]:
          - math [ref=f6e75]:
            - generic [ref=f6e79]:
              - generic [ref=f6e80]: d
              - generic [ref=f6e81]: k
          - generic [ref=f6e89]:
            - text: d
            - generic [ref=f6e90]: k
        - text: 的方差推导，和第 5 章 softmax 的指数放大效应是同一个问题的两面，对照着看收获最大。
      - listitem [ref=f6e104]: 附录 A — 补上链式法则。这两个梯度是全书唯一手算梯度的地方，算通之后「backward 在做什么」就不再是黑箱。
      - listitem [ref=f6e105]: 第 4 章 — 此时你已经知道梯度会消失，LayerNorm / GELU / 残差三个设计就都能对上了。最后的参数量推导是纯粹的手工练习，但能建立对「词表占 47%」这类事实的直觉。
      - listitem [ref=f6e106]: 第 6、7 章 — 最后读。这两章的数学本身很浅，但涉及损失聚合方式这个全书最容易被忽略的决策：5 章用 mean、6 章只取最后一个 token、7 章用 ignore_index 改分母。把这三处放在一起看，才能理解「聚合方式」不是细节而是设计。
